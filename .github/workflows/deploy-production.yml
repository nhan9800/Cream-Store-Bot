name: Bot Production - Verify and Promote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-production-promotion
  cancel-in-progress: true

jobs:
  verify:
    name: Test exact source revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate VibeHost supervisor
        run: bash -n scripts/vibehost-supervisor.sh

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Run source smoke test
        run: npm run smoke
        env:
          NODE_ENV: test

  promote:
    name: Promote verified SHA to bot-production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Promote without creating a new commit
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          git push origin "$VERIFIED_SHA:refs/heads/bot-production"
