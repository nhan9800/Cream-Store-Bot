name: Bot Production - Verify VibeHost Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-production-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Test source before VibeHost deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Run source smoke test
        run: npm run smoke
        env:
          NODE_ENV: test

      - name: Deployment safety notice
        run: |
          echo "Source is verified for VibeHost."
          echo "Automatic production upload/restart remains disabled until VibeHost's official restart API is verified."
