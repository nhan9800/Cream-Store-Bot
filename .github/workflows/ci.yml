name: Bot CI - Test & Validate

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & State Machine Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.12.0
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate production deployment source
        run: |
          set -Eeuo pipefail
          test -f scripts/backup-production.js
          test -f scripts/deploy-production.sh
          test -f scripts/rollback-production.sh
          test -f src/utils/ports.js
          test -f src/utils/revision.js
          bash -n scripts/deploy-production.sh scripts/rollback-production.sh
          node --check scripts/backup-production.js
          node --check src/utils/ports.js
          node --check src/utils/revision.js

      - name: Run Vitest Unit Tests
        run: npm test
        env:
          NODE_ENV: test
