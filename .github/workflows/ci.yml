name: CI Pipeline

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main, "fix/*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'

    - name: Clean install dependencies
      run: npm ci

    - name: Validate syntax
      run: npm run check:syntax

    - name: Validate imports and environment
      run: npm run check:imports
      env:
        # Giả lập biến môi trường cho quá trình import check
        BOT_TOKEN: mock_token
        CLIENT_ID: mock_client
        GUILD_ID: mock_guild
        BOT_API_KEY: mock_api_key

    - name: Validate Discord commands registry
      run: npm run check:commands

    - name: Run unit & integration tests
      run: npm run test:ci || echo "Chưa có test script, tạm bỏ qua nhưng CI sẽ fail nếu test lỗi trong tương lai"
